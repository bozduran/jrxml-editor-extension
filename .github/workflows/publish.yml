name: Publish release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Tag, package and publish
    if: "github.event.head_commit != null && startsWith(github.event.head_commit.message, 'chore(release): v')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm

      - name: Validate release commit
        id: release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          SUBJECT=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)
          # Accept both the raw release subject and GitHub's squash-merge suffix.
          VERSION=$(printf '%s' "$SUBJECT" | sed -nE 's/^chore\(release\): v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))( \(#[0-9]+\))?$/\1/p')
          if [ -z "$VERSION" ]; then
            echo "::error::Release commit subject must be 'chore(release): vX.Y.Z' (optionally with a (#PR) suffix)."
            exit 1
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Commit version v${VERSION} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Extension Host integration tests
        run: npm run test:integration:headless

      - name: Package VSIX
        run: npm run package

      - name: Generate checksums
        run: sha256sum -- *.vsix > SHA256SUMS

      - name: Tag the merge commit
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "refs/tags/v${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v${VERSION}" ./*.vsix SHA256SUMS \
            --title "v${VERSION}" \
            --generate-notes
