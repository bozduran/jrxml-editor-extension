name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, unit, integration and audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Extension Host integration tests
        run: npm run test:integration:headless

      - name: Package VSIX
        run: npm run package

      # The extension ships no runtime dependencies, so this gate should stay
      # empty. High and critical findings block; lower severities are reported
      # by the dev-dependency step below.
      - name: Production dependency audit (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Development dependency audit (reported)
        continue-on-error: true
        run: npm audit --audit-level=low
