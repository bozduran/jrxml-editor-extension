name: Start release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (X.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  open-release-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm

      - name: Validate version and branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Version must be a strict X.Y.Z semver without a v prefix."
            exit 1
          fi

          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "::error::Version $VERSION is already the current package version."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/release/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Branch release/v${VERSION} already exists."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Create release commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "release/v${VERSION}"
          npm version "$VERSION" --no-git-tag-version
          git add package.json package-lock.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::error::The version bump produced no changes."
            exit 1
          fi
          git commit -m "chore(release): v${VERSION}"

      - name: Push release branch
        env:
          VERSION: ${{ inputs.version }}
        run: git push origin "HEAD:refs/heads/release/v${VERSION}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BODY=$(printf '%s\n\n%s\n' \
            "Release v${VERSION}. Created by the Start release workflow." \
            "This PR was opened with the default Actions token, so GitHub does not trigger CI on it. Close and reopen the PR, or run CI manually, before merging. Squash-merge so the commit subject stays 'chore(release): v${VERSION}' for the publish workflow.")
          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "release/v${VERSION}" \
            --title "chore(release): v${VERSION}" \
            --body "$BODY"
