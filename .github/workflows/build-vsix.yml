name: Build VSIX

on:
  # Manual trigger. "bump" bumps the version on the default branch before
  # packaging; "none" rebuilds the current version only.
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump before packaging (default branch only)'
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

# Needed so a bump can push its commit/tag and a tag build can attach the VSIX
# to a GitHub Release.
permissions:
  contents: write

# Serialize packaging/release runs for the same branch or tag.
concurrency:
  group: build-vsix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the bump commit and tag can be pushed.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Version bumps are only allowed on the default branch (${DEFAULT_BRANCH}); this run is on ${GITHUB_REF}."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Bumps package.json + package-lock.json, runs the "version" script
          # (changelog heading), commits and creates the annotated vX.Y.Z tag.
          npm version "${BUMP}" -m 'chore(release): %s'

          VERSION=$(node -p "require('./package.json').version")
          if ! TAGS=$(git ls-remote --tags origin "refs/tags/v${VERSION}"); then
            echo "::error::Could not query tags from origin."
            exit 1
          fi
          if [ -n "${TAGS}" ]; then
            echo "::error::Tag v${VERSION} already exists on origin; choose a larger bump first."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The version bump left uncommitted changes."
            git status --short
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "${REF_TYPE}" = "tag" ]; then
            TAG="${REF_NAME}"
            if [ "${TAG}" != "v${VERSION}" ]; then
              echo "::error::Tag ${TAG} does not match package.json version v${VERSION}."
              exit 1
            fi
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # The extension has no runtime dependencies, so vsce runs straight from
      # npx with --no-dependencies and no npm install step is required.
      - name: Package VSIX
        run: npx --yes @vscode/vsce@^3.3.2 package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: jrxml-editor-vsix
          path: '*.vsix'
          if-no-files-found: error

      - name: Push bump commit and tag
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Tracked files changed after packaging; the VSIX would not match the tag."
            exit 1
          fi
          # Atomic: either both the commit and the tag land, or neither does.
          # GITHUB_TOKEN pushes do not trigger another workflow run, so this run
          # creates the release itself instead of waiting for a tag build.
          git push --atomic origin "HEAD:${DEFAULT_BRANCH}" "refs/tags/${TAG}"

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.bump != 'none')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: '*.vsix'
          generate_release_notes: true
